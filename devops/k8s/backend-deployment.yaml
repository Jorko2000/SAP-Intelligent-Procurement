apiVersion: apps/v1
kind: Deployment
metadata:
  name: procurement-backend
  labels:
    app: procurement-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: procurement-backend
  template:
    metadata:
      labels:
        app: procurement-backend
    spec:
      containers:
        - name: backend
          image: your-dockerhub/procurement-backend:latest
          ports:
            - containerPort: 4000
          env:
            - name: NODE_ENV
              value: "production"
            - name: DB_HOST
              value: "postgres"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "procurement"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: password
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 30
